[Service]
Environment=GIT_TERMINAL_PROMPT=0
ExecStartPre=/usr/bin/git -C %h/BlueEngine-idea-forge-native diff --quiet
ExecStartPre=/usr/bin/git -C %h/BlueEngine-idea-forge-native diff --cached --quiet
ExecStartPre=/usr/bin/timeout --kill-after=10s 180s /usr/bin/git -C %h/BlueEngine-idea-forge-native fetch origin main
ExecStartPre=/usr/bin/git -C %h/BlueEngine-idea-forge-native merge --ff-only origin/main
