<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlueEngine Games</title><link rel="stylesheet" href="style.css">
<header><h1>BlueEngine Games</h1><p class="tagline">Play in your browser or install locally. Star favorites to keep them first on this device.</p></header>
<div class="toolbar"><input id="search" type="search" placeholder="Search games…" aria-label="Search games"><select id="sort" aria-label="Sort games"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="name">Name A–Z</option><option value="size">Smallest first</option></select><div class="kinds" role="group" aria-label="Filter by kind"><button data-kind="" class="active">All</button></div></div>
<main id="grid">{{cards}}</main><p id="empty" hidden>No games match.</p><script src="app.js"></script></html>
