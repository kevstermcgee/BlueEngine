[package]
name = "bluedm"
version = "0.1.0"
edition = "2021"
description = "Authoritative online team-deathmatch FPS prototype built with BlueEngine"
license = "MIT"
default-run = "bluedm"

[lib]
name = "bluedm"
path = "src/lib.rs"

[[bin]]
name = "bluedm"
path = "src/main.rs"

[[bin]]
name = "bluedm-server"
path = "src/bin/bluedm-server.rs"

[dependencies]
vesper3d = { path = "../..", package = "be2", default-features = false }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
macroquad = { version = "=0.4.14", default-features = false }
