[package]
name = "orchard-watch"
version = "0.1.0"
edition = "2021"
[features]
default = ["client"]
client = ["vesper3d/two-d", "vesper3d/gamepad", "dep:macroquad"]
[[bin]]
name = "orchard-watch"
required-features = ["client"]
[dependencies]
vesper3d = { package = "be2", path = "../..", default-features = false }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
macroquad = { version = "=0.4.14", default-features = false, optional = true }
[profile.release]
opt-level = "s"
lto = "thin"
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
