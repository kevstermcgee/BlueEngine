[package]
name = "be2"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "Blue Engine 2: client and headless simulation"
license = "MIT"
default-run = "be2"

[lib]
name = "vesper3d"

[[bin]]
name = "vesper3d"
path = "src/main.rs"
required-features = ["offline"]

[[bin]]
name = "be2"
path = "src/bin/blue-engine.rs"
required-features = ["client"]

[features]
default = ["client"]
# Opt into the stock rigid-body world or production native transports independently.
# Rules, snapshots, integer 2D collision and static authoring remain rendering-free.
physics = ["dep:rapier3d"]
networking = ["dep:rustls", "dep:tokio", "dep:quinn"]
# Optional bounded resource transactions; recipes and rules stay game-owned.
resources = []
# Historical name: cinematic scene export, unrelated to offline gameplay.
offline = ["dep:png", "dep:ctrlc"]
presentation = ["dep:macroquad", "macroquad/audio"]
two-d-draw = ["dep:macroquad"]
two-d = ["two-d-draw", "macroquad/audio"]
portable = ["two-d"]
model-import = ["presentation", "dep:gltf", "dep:base64", "dep:image"]
schema-generation = ["dep:schemars"]
schema-validation = ["schema-generation", "dep:jsonschema"]
native-client = ["presentation", "gamepad", "dep:windows-sys"]
client = ["native-client", "physics", "networking"]
gamepad = ["dep:gilrs"]

[[bin]]
name = "be2-headless"
path = "src/bin/be2-headless.rs"
required-features = ["physics", "networking"]

[[bin]]
name = "be2-ctl"
path = "src/bin/be2-ctl.rs"

[[bin]]
name = "be2-hub"
path = "src/bin/be2-hub.rs"
required-features = ["networking"]

[[bin]]
name = "be2-toy-server"
path = "src/bin/be2-toy-server.rs"
required-features = ["networking"]

[[bin]]
name = "be2-tools"
path = "src/bin/be2-tools.rs"
required-features = ["physics", "networking"]

[[bin]]
name = "be2-model-import"
path = "src/bin/be2-model-import.rs"
required-features = ["model-import"]

[[bin]]
name = "blueengine-sandbox"
path = "src/bin/blueengine-sandbox.rs"
required-features = ["client"]

[[example]]
name = "minimal_game"
required-features = ["client"]

[[example]]
name = "custom_client"
required-features = ["client"]

[[example]]
name = "shadow_demo"
required-features = ["client"]

[[example]]
name = "audio_preview"
required-features = ["presentation"]

[[example]]
name = "imported_room"
required-features = ["portable"]

[dependencies]
ring = "=0.17.14"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
png = { version = "=0.17.16", optional = true }
ctrlc = { version = "=3.4.5", optional = true }
macroquad = { version = "=0.4.14", default-features = false, optional = true }
schemars = { version = "=1.2.2", optional = true }
jsonschema = { version = "=0.34.0", default-features = false, optional = true }
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "KHR_materials_unlit"], optional = true }
base64 = { version = "=0.22.1", optional = true }
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg"], optional = true }
gilrs = { version = "=0.11.2", optional = true }
rapier3d = { version = "=0.26.1", features = ["enhanced-determinism"], optional = true }
getrandom = "0.3.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"], optional = true }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { optional = true, version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Iteration/check profiles; shipping still uses `cargo build --release`.
# `--profile fast`: optimized enough to run, but parallel codegen and no LTO, so an edit
# relinks in seconds instead of a serial single-unit LTO build.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# `--profile itest`: debug build whose dependencies (physics, math) are optimized, so
# physics-heavy tests run at usable speed; line tables only keeps test binaries small.
[profile.itest]
inherits = "dev"
debug = "line-tables-only"
[profile.itest.package."*"]
opt-level = 3
debug = false

[dev-dependencies]
rcgen = "0.14"

