[package]
name = "be2"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "Blue Engine 2: client and headless simulation"
license = "MIT"
default-run = "be2"

[lib]
name = "vesper3d"

[[bin]]
name = "vesper3d"
path = "src/main.rs"
required-features = ["offline"]

[[bin]]
name = "be2"
path = "src/bin/blue-engine.rs"
required-features = ["client"]

[features]
default = ["client", "offline"]
offline = ["dep:png", "dep:ctrlc"]
presentation = ["dep:macroquad"]
two-d = ["dep:macroquad"]
portable = ["two-d"]
client = ["presentation", "gamepad", "dep:windows-sys"]
gamepad = ["dep:gilrs"]

[[bin]]
name = "be2-headless"
path = "src/bin/be2-headless.rs"

[[bin]]
name = "be2-ctl"
path = "src/bin/be2-ctl.rs"

[[bin]]
name = "be2-hub"
path = "src/bin/be2-hub.rs"

[[bin]]
name = "be2-toy-server"
path = "src/bin/be2-toy-server.rs"

[[bin]]
name = "be2-tools"
path = "src/bin/be2-tools.rs"

[[bin]]
name = "blueengine-sandbox"
path = "src/bin/blueengine-sandbox.rs"
required-features = ["client"]

[[example]]
name = "minimal_game"
required-features = ["client"]

[[example]]
name = "custom_client"
required-features = ["client"]

[[example]]
name = "shadow_demo"
required-features = ["client"]

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
png = { version = "=0.17.16", optional = true }
ctrlc = { version = "=3.4.5", optional = true }
macroquad = { version = "=0.4.14", default-features = false, features = ["audio"], optional = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gilrs = { version = "=0.11.2", optional = true }
rapier3d = { version = "=0.26.1", features = ["enhanced-determinism"] }
getrandom = "0.3.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { optional = true, version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Opt-in iteration profiles (CI and `cargo build --release` are unaffected).
# `--profile fast`: optimized enough to run, but parallel codegen and no LTO, so an edit
# relinks in seconds instead of a serial single-unit LTO build.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# `--profile itest`: debug build whose dependencies (physics, math) are optimized, so
# physics-heavy tests run at usable speed; line tables only keeps test binaries small.
[profile.itest]
inherits = "dev"
debug = "line-tables-only"
[profile.itest.package."*"]
opt-level = 3
debug = false

[dev-dependencies]
rcgen = "0.14"
