[package]
name = "be2"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "Blue Engine 2: client and headless simulation"
license = "MIT"
default-run = "be2"

[lib]
name = "vesper3d"

[[bin]]
name = "vesper3d"
path = "src/main.rs"
required-features = ["offline"]

[[bin]]
name = "be2"
path = "src/bin/blue-engine.rs"
required-features = ["client"]

[features]
default = ["client", "offline"]
offline = ["dep:png", "dep:ctrlc"]
presentation = ["dep:macroquad"]
client = ["presentation", "dep:windows-sys"]

[[bin]]
name = "be2-headless"
path = "src/bin/be2-headless.rs"

[[bin]]
name = "be2-tools"
path = "src/bin/be2-tools.rs"

[[example]]
name = "custom_client"
required-features = ["client"]

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
png = { version = "=0.17.16", optional = true }
ctrlc = { version = "=3.4.5", optional = true }
macroquad = { version = "=0.4.14", default-features = false, features = ["audio"], optional = true }
rapier3d = "=0.26.1"
getrandom = "0.3.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { optional = true, version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
rcgen = "0.14"
