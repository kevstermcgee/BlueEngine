[package]
name = "be2"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "Blue Engine 2: client and headless simulation"
license = "MIT"
default-run = "be2"

[lib]
name = "vesper3d"

[[bin]]
name = "vesper3d"
path = "src/main.rs"
required-features = ["offline"]

[[bin]]
name = "be2"
path = "src/bin/blue-engine.rs"
required-features = ["client"]

[features]
default = ["client", "offline"]
offline = ["dep:png", "dep:ctrlc"]
client = ["dep:macroquad", "dep:windows-sys"]

[[bin]]
name = "be2-headless"
path = "src/bin/be2-headless.rs"

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
png = { version = "=0.17.16", optional = true }
ctrlc = { version = "=3.4.5", optional = true }
macroquad = { version = "=0.4.14", default-features = false, features = ["audio"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { optional = true, version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = "thin"
codegen-units = 1
