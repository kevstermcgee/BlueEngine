[package]
name = "vesper3d"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Deterministic, AI-first 3D animation to MP4"
license = "MIT"

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
png = "=0.17.16"
ctrlc = "=3.4.5"

[profile.release]
lto = "thin"
codegen-units = 1
