name: Engine checks
on: [push, pull_request]
concurrency:
  group: engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build locked headless server and tooling
        run: docker build -t blueengine-server .
      - name: Tooling and bounded dedicated server smoke
        run: |
          docker run --rm --entrypoint be2-tools blueengine-server describe
          docker run --rm blueengine-server --server 0.0.0.0:7777 --transport development --ticks 6
      - name: Production QUIC server with an ephemeral identity
        run: |
          mkdir -m 755 .be2-work-container-tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout .be2-work-container-tls/key.pem -out .be2-work-container-tls/cert.pem -days 1 -subj /CN=localhost
          openssl pkcs8 -topk8 -nocrypt -in .be2-work-container-tls/key.pem -outform DER -out .be2-work-container-tls/key.der
          openssl x509 -in .be2-work-container-tls/cert.pem -outform DER -out .be2-work-container-tls/cert.der
          chmod 444 .be2-work-container-tls/*.der
          docker run --rm -v "$PWD/.be2-work-container-tls:/tls:ro" -e BLUE_TLS_KEY_FILE=/tls/key.der -e BLUE_TLS_CERT_FILE=/tls/cert.der blueengine-server --server 0.0.0.0:7777 --transport production --ticks 6
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Upgrade regressions inspect real revision ancestry.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          # Same cache prefix as the former key=engine-checks in job=test.
          shared-key: engine-checks-test
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libasound2-dev libudev-dev pkg-config xvfb libgl1-mesa-dri libxtst6
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Shared Win32 focus and generated-client native hotkeys
        if: runner.os == 'Windows'
        # Real foreground windows and SendInput; software input does not certify physical devices.
        run: cargo test --locked --profile itest --lib viewer::game_input::windows_tests::native_windows_focus_gates_generated_hotkeys -- --ignored --exact --nocapture
      # Same gate list and optimized dependency profile as local full verification.
      # Cache compilation only: every check and every test still executes.
      - name: Full engine verification
        run: python tools/be2.py check
      - name: Shared X11 focus and outside-window input releases
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked --profile itest --no-default-features --features two-d --lib viewer::focus::platform::tests::native_focus_uses_real_window_without_a_gl_context -- --ignored --exact
      - run: cargo build --release --locked
      - run: cargo build --release --locked --no-default-features --features physics,networking --bin be2-headless

      # Rustdoc, headless boundaries, authoring, Python and maintained-game gates
      # already ran in the canonical checker above. Repeating them changed Cargo
      # profiles and duplicated tests; retain shipping builds and real audio below.
      - name: Stock audio offscreen verification (Linux)
        if: runner.os == 'Linux'
        env:
          BE2_AUDIO_OFFSCREEN: '1'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python tools/stock_audio_smoke.py target/release/be2 .be2-work/stock-audio
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-checks-${{ runner.os }}
          path: .be2-work/check-*/
          include-hidden-files: true
      - name: Stock audio rendered evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: stock-audio-offscreen
          path: .be2-work/stock-audio/
          include-hidden-files: true
  test:
    if: always()
    needs: [engine, leo, idea-forge, wormhole, sway, container]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require all engine and game gates
        shell: bash
        env:
          CONTAINER_RESULT: ${{ needs.container.result }}
          ENGINE_RESULT: ${{ needs.engine.result }}
          LEO_RESULT: ${{ needs.leo.result }}
          FORGE_RESULT: ${{ needs.idea-forge.result }}
          WORMHOLE_RESULT: ${{ needs.wormhole.result }}
          SWAY_RESULT: ${{ needs.sway.result }}
        run: |
          test "$CONTAINER_RESULT" = success
          test "$ENGINE_RESULT" = success
          test "$LEO_RESULT" = success
          test "$FORGE_RESULT" = success
          test "$WORMHOLE_RESULT" = success
          test "$SWAY_RESULT" = success
  # Independent game checks overlap engine verification. Rendered feedback is available
  # early; the workflow is green only after BOTH matrices finish every existing gate.
  leo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine-checks-test
          save-if: false # Engine job owns writes; both restore compatible dependency artifacts.
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config xvfb libgl1-mesa-dri libxtst6
      - name: Build and package Leo
        shell: bash # Fail on EACH native command on Windows too.
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo fmt --manifest-path assets/games/leo/Cargo.toml --check
          cargo build --locked --release --manifest-path assets/games/leo/Cargo.toml
          python assets/games/leo/scripts/ship.py ship --folder .be2-work/leo-launchers --no-build --no-launch --no-smoke
      - name: Leo offscreen day, save and audio verification (Linux)
        if: runner.os == 'Linux'
        env:
          BE2_AUDIO_OFFSCREEN: '1'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python tools/leo_smoke.py assets/games/leo/dist/leo .be2-work/leo-capture
      - name: Early Leo pictures (Linux)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: leo-images
          path: |
            .be2-work/leo-capture/*/shot_*.png
            .be2-work/leo-capture/*/run.json
            .be2-work/leo-capture/evidence.json
            .be2-work/leo-capture/*.log
          include-hidden-files: true
      - name: Leo headless and client verification
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo test --locked --manifest-path assets/games/leo/Cargo.toml --no-default-features
          cargo clippy --locked --manifest-path assets/games/leo/Cargo.toml --all-targets -- -D warnings
          cargo build --release --locked --no-default-features --features physics,networking --bin be2-tools
          python assets/games/leo/scripts/check.py --ship-folder .be2-work/leo-launchers
      - name: Leo rendered and packaged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leo-${{ runner.os }}
          path: |
            .be2-work/leo-capture/
            .be2-work/leo-launchers/
            assets/games/leo/.blue-check/
            assets/games/leo/dist/
          include-hidden-files: true

  idea-forge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        game: [idea-forge, automation-workshop, afterpull]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine-checks-test
          save-if: false
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config xvfb libgl1-mesa-dri libxtst6
      - name: Utility rules, exports, presentation and lint
        shell: bash
        run: |
          cargo fmt --manifest-path games/${{ matrix.game }}/Cargo.toml --check
          cargo test --locked --manifest-path games/${{ matrix.game }}/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path games/${{ matrix.game }}/Cargo.toml -- -D warnings
      - name: Prepare pinned software OpenGL for Windows CI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa-ci.7z'
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa-ci'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $archive
          $expected = '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Mesa archive checksum mismatch' }
          & 7z x $archive "-o$mesa" 'x64/*' -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $driver = Join-Path $mesa 'x64'
          if (!(Test-Path (Join-Path $driver 'opengl32.dll'))) { throw 'Mesa OpenGL driver missing' }
          "BE2_CI_OPENGL_DIR=$driver" >> $env:GITHUB_ENV
      - name: Windows package resources and isolated smoke
        if: runner.os == 'Windows'
        shell: python
        run: |
          import ctypes, os, runpy, sys
          # Windows children inherit this process's DLL directory. The real smoke
          # still copies only declared product files into its isolated directory.
          # Mesa remains a pinned CI dependency, outside the shipped package.
          kernel = ctypes.WinDLL('kernel32', use_last_error=True)
          set_directory = kernel.SetDllDirectoryW
          set_directory.argtypes = [ctypes.c_wchar_p]
          set_directory.restype = ctypes.c_int
          if not set_directory(os.environ['BE2_CI_OPENGL_DIR']):
              raise ctypes.WinError(ctypes.get_last_error())
          os.environ.update(GALLIUM_DRIVER='llvmpipe', LIBGL_ALWAYS_SOFTWARE='1')
          sys.argv = ['games/${{ matrix.game }}/scripts/ship.py', 'ship', '--no-install']
          try:
              runpy.run_path(sys.argv[0], run_name='__main__')
          finally:
              if not set_directory(None):
                  raise ctypes.WinError(ctypes.get_last_error())
      - name: Workshop Windows x64 installer
        if: runner.os == 'Windows' && matrix.game == 'automation-workshop'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler missing; Windows x64 installer gate is unverified.' }
          python games/automation-workshop/scripts/ship.py installer build --iscc $compiler
          if ($LASTEXITCODE -ne 0) { throw 'Workshop Windows x64 installer build failed; completed packages retained.' }
      - name: Linux package and isolated smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "$RUNNER_TEMP/forge-asound.conf"
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ALSA_CONFIG_PATH="$RUNNER_TEMP/forge-asound.conf" python games/${{ matrix.game }}/scripts/ship.py ship --no-install
      - name: Bounded authoritative gameplay and serial comparison
        if: runner.os == 'Linux' && matrix.game != 'idea-forge'
        shell: bash
        run: |
          adapter=workshop
          if [ '${{ matrix.game }}' = afterpull ]; then adapter=afterpull-playtest; fi
          cargo build --locked --release --manifest-path games/${{ matrix.game }}/Cargo.toml --no-default-features --bin "$adapter"
          python tools/playtest.py --binary "$GITHUB_WORKSPACE/target/release/$adapter" --seeds 0,1,7,42 --ticks 10000 --compare-serial --out .be2-work/playtest-${{ matrix.game }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.game }}-native-${{ runner.os }}
          path: |
            games/${{ matrix.game }}/dist/ship.json
            games/${{ matrix.game }}/.blue-check/
            .be2-work/playtest-${{ matrix.game }}/
          include-hidden-files: true

