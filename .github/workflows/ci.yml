name: Engine checks
on: [push, pull_request]
concurrency:
  group: engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Upgrade regressions inspect real revision ancestry.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-checks
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libasound2-dev libudev-dev pkg-config
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      # Same gate list and optimized dependency profile as local full verification.
      # Cache compilation only: every check and every test still executes.
      - name: Full engine verification
        run: python tools/be2.py check
      - run: cargo build --release --locked
      - run: cargo build --release --locked --no-default-features --bin be2-headless
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-checks-${{ runner.os }}
          path: .be2-work/check-*/
