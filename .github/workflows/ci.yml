    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine-checks-test
          save-if: false
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config xvfb libgl1-mesa-dri libxtst6
      - name: Journey rules, presentation and lint
        shell: bash
        run: |
          cargo fmt --manifest-path games/wormhole/Cargo.toml --check
          cargo test --locked --manifest-path games/wormhole/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path games/wormhole/Cargo.toml -- -D warnings
      - name: Prepare pinned software OpenGL for Windows CI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa-ci.7z'
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa-ci'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $archive
          $expected = '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Mesa archive checksum mismatch' }
          & 7z x $archive "-o$mesa" 'x64/*' -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $driver = Join-Path $mesa 'x64'
          if (!(Test-Path (Join-Path $driver 'opengl32.dll'))) { throw 'Mesa OpenGL driver missing' }
          "BE2_CI_OPENGL_DIR=$driver" >> $env:GITHUB_ENV
      - name: Windows package resources and isolated smoke
        if: runner.os == 'Windows'
        shell: python
        run: |
          import ctypes, os, runpy, sys
          # Windows children inherit this process's DLL directory. The real smoke
          # still copies only declared product files into its isolated directory.
          # Mesa remains a pinned CI dependency, outside the shipped package.
          kernel = ctypes.WinDLL('kernel32', use_last_error=True)
          set_directory = kernel.SetDllDirectoryW
          set_directory.argtypes = [ctypes.c_wchar_p]
          set_directory.restype = ctypes.c_int
          if not set_directory(os.environ['BE2_CI_OPENGL_DIR']):
              raise ctypes.WinError(ctypes.get_last_error())
          os.environ.update(GALLIUM_DRIVER='llvmpipe', LIBGL_ALWAYS_SOFTWARE='1')
          sys.argv = ['games/wormhole/scripts/ship.py', 'ship', '--no-install']
          try:
              runpy.run_path(sys.argv[0], run_name='__main__')
          finally:
              if not set_directory(None):
                  raise ctypes.WinError(ctypes.get_last_error())
      - name: Linux package and isolated smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "$RUNNER_TEMP/wormhole-asound.conf"
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ALSA_CONFIG_PATH="$RUNNER_TEMP/wormhole-asound.conf" python games/wormhole/scripts/ship.py ship --no-install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wormhole-native-${{ runner.os }}
          path: |
            games/wormhole/dist/ship.json
            games/wormhole/.blue-check/
          include-hidden-files: true

  sway:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine-checks-test
          save-if: false
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config xvfb libgl1-mesa-dri libxtst6
      - name: Media analysis, variation rules, presentation and lint
        shell: bash
        run: |
          cargo fmt --manifest-path games/sway/Cargo.toml --check
          cargo test --locked --manifest-path games/sway/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path games/sway/Cargo.toml -- -D warnings
      - name: Prepare pinned software OpenGL for Windows CI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa-ci.7z'
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa-ci'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $archive
          $expected = '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Mesa archive checksum mismatch' }
          & 7z x $archive "-o$mesa" 'x64/*' -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $driver = Join-Path $mesa 'x64'
          if (!(Test-Path (Join-Path $driver 'opengl32.dll'))) { throw 'Mesa OpenGL driver missing' }
          "BE2_CI_OPENGL_DIR=$driver" >> $env:GITHUB_ENV
      - name: Windows package resources and isolated smoke
        if: runner.os == 'Windows'
        shell: python
        run: |
          import ctypes, os, pathlib, runpy, subprocess, sys
          # Windows children inherit this process's DLL directory. The real smoke
          # still copies only declared product files into its isolated directory.
          # Mesa remains a pinned CI dependency, outside the shipped package.
          kernel = ctypes.WinDLL('kernel32', use_last_error=True)
          set_directory = kernel.SetDllDirectoryW
          set_directory.argtypes = [ctypes.c_wchar_p]
          set_directory.restype = ctypes.c_int
          if not set_directory(os.environ['BE2_CI_OPENGL_DIR']):
              raise ctypes.WinError(ctypes.get_last_error())
          os.environ.update(GALLIUM_DRIVER='llvmpipe', LIBGL_ALWAYS_SOFTWARE='1')
          sys.argv = ['games/sway/scripts/ship.py', 'ship', '--no-install']
          try:
              ship_result = 0
              try:
                  runpy.run_path(sys.argv[0], run_name='__main__')
              except SystemExit as result:
                  ship_result = result.code or 0
              subprocess.run([sys.executable, 'games/sway/scripts/native_controls.py', '--exe', str(pathlib.Path(os.environ['CARGO_TARGET_DIR']) / 'release' / 'sway.exe')], check=True)
              if ship_result:
                  sys.exit(ship_result)
          finally:
              if not set_directory(None):
                  raise ctypes.WinError(ctypes.get_last_error())
      - name: Linux development presentation and synchronized controls
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --release --locked --manifest-path games/sway/Cargo.toml
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 python games/sway/scripts/native_controls.py --exe "$CARGO_TARGET_DIR/release/sway"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sway-native-${{ runner.os }}
          path: |
            games/sway/dist/ship.json
            games/sway/.blue-check/
          include-hidden-files: true
